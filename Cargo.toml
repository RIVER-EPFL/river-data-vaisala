[package]
name = "river-data-vaisala"
version = "0.3.0"
edition = "2024"
rust-version = "1.95"
description = "Vaisala viewLinc sync microservice for River Data"
license = "MIT"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
river-data-core = { version = "0.8.0", features = ["client"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
thiserror = "2.0"
